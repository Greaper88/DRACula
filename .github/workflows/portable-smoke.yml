name: Portable JAR smoke check
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published preview tag to validate
        required: true
        default: v0.1.3
permissions:
  contents: read
jobs:
  startup:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download and prepare the released JAR without a checkout
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'DRACula-*.jar'
          jars=(DRACula-*.jar)
          java -Djava.awt.headless=true "-Ddracula.home=${RUNNER_TEMP}/dracula-smoke" -jar "${jars[0]}" --prepare-only
