name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Offline regression checks and release JAR
        run: |
          python -m pip install -r apps/web/requirements-test.txt
          ./scripts/check.sh
          python scripts/build-release.py
      - name: Verify standalone backend bootstrap
        run: java -Djava.awt.headless=true -Ddracula.home="$RUNNER_TEMP/dracula" -jar dist/DRACula-0.1.0.jar --prepare-only
      - name: Build and publish runtime-free image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/dracula"
          docker build --platform linux/amd64 -f apps/web/Dockerfile --build-arg BUNDLE_JAVA=false -t "$image:$version" -t "$image:latest" .
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_REPOSITORY_OWNER" --password-stdin
          docker push "$image:$version"
          docker push "$image:latest"
      - name: Publish preview release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/DRACula-0.1.0.jar dist/DRACula-0.1.0-source.tar.gz dist/SHA256SUMS --verify-tag --title "DRACula $GITHUB_REF_NAME" --notes-file docs/RELEASE_NOTES.md --prerelease
