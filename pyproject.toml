[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dracula-management"
version = "0.1.0"
description = "Shared management core for legacy Dell remote access controllers"
requires-python = ">=3.12"

[project.scripts]
dracula = "dracula.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
